<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="dahiOS NFC etiket detayı: Etiket bilgileri, yönlendirme ve dahi's One karakter sayfası.">
    <meta name="keywords" content="dahiOS, NFC etiket, tag detay, dahis one etiket">
    <title>dahiOS Etiket - dahi's One</title>
    <link rel="canonical" href="https://dahis.io/tag-detail">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2672908385908922"
     crossorigin="anonymous"></script>
    <script>
        // AdSense reklamlarını başlat (sadece bir kez, hata kontrolü ile)
        (function() {
            var adsInitialized = false;
            
            // AdSense 400 hatalarını console'da gizle (hesap onayı beklenirken normal)
            var originalError = console.error;
            console.error = function() {
                var args = Array.prototype.slice.call(arguments);
                var errorStr = args.join(' ');
                // AdSense 400 hatalarını gizle
                if (errorStr.includes('ads?client=ca-pub-') && errorStr.includes('400')) {
                    return; // Bu hatayı gösterme
                }
                originalError.apply(console, args);
            };
            
            function initAds() {
                if (adsInitialized) return;
                
                // AdSense script yüklenmiş mi kontrol et
                if (!window.adsbygoogle) {
                    // Script henüz yüklenmemiş, bekle
                    setTimeout(initAds, 200);
                    return;
                }
                
                var ads = document.querySelectorAll('.adsbygoogle');
                if (ads.length === 0) return;
                
                ads.forEach(function(ad) {
                    if (ad.innerHTML.trim() !== '') return;
                    
                    try {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                    } catch (e) {
                        // Hataları sessizce ignore et (AdSense hesap onayı beklenirken normal)
                        if (e.message && !e.message.includes('already have ads')) {
                            // Sessizce devam et
                        }
                    }
                });
                adsInitialized = true;
            }
            
            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                setTimeout(initAds, 1000);
            } else {
                window.addEventListener('load', function() {
                    setTimeout(initAds, 1000);
                });
            }
        })();
    </script>
    <style>
        .tag-detail-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .tag-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .error {
            color: #ff4444;
            text-align: center;
            padding: 40px;
        }
        .adsense-container {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            text-align: center;
        }
        .adsense-top {
            margin-bottom: 20px;
        }
        .adsense-bottom {
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .adsense-container {
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>
    <!-- AdSense Banner - Top -->
    <div class="adsense-container adsense-top">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-2672908385908922"
             data-ad-slot="2251888532"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
    </div>

    <div class="tag-detail-container">
        <div id="tagContent" class="tag-content">
            <div class="loading">
                <p>Yükleniyor...</p>
            </div>
        </div>
    </div>

    <!-- AdSense Banner - Bottom -->
    <div class="adsense-container adsense-bottom">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-2672908385908922"
             data-ad-slot="2251888532"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
    </div>

    <script>
        // URL parametrelerinden bilgileri al
        const urlParams = new URLSearchParams(window.location.search);
        const dahiosId = urlParams.get('dahiosId') || urlParams.get('nfcId');
        const isActive = urlParams.get('isActive') === 'true';
        const characterId = urlParams.get('characterId') || '';
        const profileLinkTypesStr = urlParams.get('profileLinkTypes');
        const userDataStr = urlParams.get('userData');

        if (!dahiosId) {
            document.getElementById('tagContent').innerHTML = `
                <div class="error">
                    <h2>Hata</h2>
                    <p>dahiOS ID bulunamadı.</p>
                    <a href="/" style="color: #fff; text-decoration: underline;">Ana Sayfaya Dön</a>
                </div>
            `;
        } else {
            // URL parametrelerinden tag bilgilerini oluştur
            const tagData = {
                dahiosId: dahiosId,
                isActive: isActive,
                characterId: characterId,
                profileLinkTypes: profileLinkTypesStr,
                userData: userDataStr
            };
            
            // Direkt render et
            renderTagContent(tagData);
        }

        // Tag bilgilerini HTML olarak render et
        function renderTagContent(tagData) {
            const contentDiv = document.getElementById('tagContent');
            
            // Pasif tag durumu
            if (!tagData.isActive) {
                const characterId = tagData.characterId || "unknown";
                const characterName = characterId.charAt(0).toUpperCase() + characterId.slice(1);
                
                contentDiv.innerHTML = `
                    <div class="icon" style="font-size: 64px; margin-bottom: 20px; opacity: 0.8;">⏸️</div>
                    <h1 style="font-size: 28px; margin-bottom: 16px; font-weight: 700;">Bu dahiOS Cihazı Şu Anda Pasif</h1>
                    <p style="font-size: 16px; line-height: 1.6; margin-bottom: 24px; opacity: 0.9;">
                        <span style="font-weight: 600; color: #ffd700;">${characterName}</span> karakterine
                        ait dahiOS cihazı şu anda aktif değil.
                    </p>
                    <p style="font-size: 16px; line-height: 1.6; margin-bottom: 24px; opacity: 0.9;">
                        Cihazı aktif hale getirmek için lütfen cihaz sahibiyle iletişime
                        geçin veya dahi's uygulamasından cihazı yönetin.
                    </p>
                    <a href="https://dahis.io" style="display: inline-block; background: rgba(255, 255, 255, 0.2); color: #fff; padding: 12px 24px; border-radius: 25px; text-decoration: none; font-weight: 600; transition: all 0.3s ease; border: 1px solid rgba(255, 255, 255, 0.3);">dahi's Ana Sayfaya Dön</a>
                    <div style="margin-top: 32px; font-size: 12px; opacity: 0.7;">
                        dahi's One © 2025
                    </div>
                `;
                return;
            }

            // Aktif tag - profil linkleri varsa göster
            let profileLinkTypes = null;
            if (tagData.profileLinkTypes) {
                try {
                    profileLinkTypes = typeof tagData.profileLinkTypes === 'string' 
                        ? JSON.parse(tagData.profileLinkTypes) 
                        : tagData.profileLinkTypes;
                } catch (e) {
                    profileLinkTypes = tagData.profileLinkTypes;
                }
            } else if (tagData.profileLinkType) {
                profileLinkTypes = [tagData.profileLinkType];
            }
            
            let userData = null;
            if (tagData.userData) {
                try {
                    userData = typeof tagData.userData === 'string' 
                        ? JSON.parse(tagData.userData) 
                        : tagData.userData;
                } catch (e) {
                    userData = tagData.userData;
                }
            } else if (tagData.user) {
                userData = tagData.user;
            }
            
            if (profileLinkTypes && profileLinkTypes.length > 0 && userData) {
                // Karakter renk kodları
                const characterColors = {
                    "puls": {primary: "#ff4444", secondary: "#cc3333"},
                    "zest": {primary: "#ff8844", secondary: "#cc6633"},
                    "lumo": {primary: "#ffdd44", secondary: "#ccaa33"},
                    "vigo": {primary: "#44dd88", secondary: "#33aa66"},
                    "aura": {primary: "#4488ff", secondary: "#3366cc"},
                    "nox": {primary: "#7c8496", secondary: "#3a3f4b"},
                };
                
                const characterId = tagData.characterId || "puls";
                const charColor = characterColors[characterId] || characterColors["puls"];
                
                // Body background rengini değiştir
                document.querySelector('.tag-detail-container').style.background = 
                    `linear-gradient(135deg, ${charColor.primary} 0%, ${charColor.secondary} 100%)`;
                
                // Profil linklerini oluştur
                const profileLinks = profileLinkTypes.map(linkType => {
                    const profileValue = userData[linkType] || "";
                    if (!profileValue) return null;
                    
                    let url = "";
                    let label = "";
                    let icon = "";
                    
                    switch (linkType) {
                        case "instagram": {
                            const instagramHandle = profileValue.replace(/^@?/, "");
                            url = `https://www.instagram.com/${instagramHandle}/`;
                            label = "Instagram";
                            icon = "📷";
                            break;
                        }
                        case "whatsapp": {
                            const whatsappNumber = profileValue.replace(/\D/g, "");
                            url = `https://wa.me/${whatsappNumber}`;
                            label = "WhatsApp";
                            icon = "💬";
                            break;
                        }
                        case "phone": {
                            const phoneNumber = profileValue.replace(/\D/g, "");
                            url = `tel:${phoneNumber}`;
                            label = "Telefon";
                            icon = "📞";
                            break;
                        }
                        case "email":
                            url = `mailto:${profileValue}`;
                            label = "E-posta";
                            icon = "✉️";
                            break;
                        case "iban": {
                            const accountName = userData.paymentAccountName || "";
                            const bankName = userData.bankName || "";
                            label = "Ödeme Bilgileri (IBAN)";
                            icon = "🏦";
                            return {url: null, label, icon, value: profileValue, accountName, bankName, isIban: true};
                        }
                    }
                    
                    return {url, label, icon, value: profileValue};
                }).filter(link => link !== null);
                
                // IBAN / ödeme kartları (tıklanmaz, kopyalanabilir)
                const ibanLinks = profileLinks.filter(l => l.isIban);
                const otherLinks = profileLinks.filter(l => !l.isIban);
                
                if (otherLinks.length === 1 && ibanLinks.length === 0) {
                    // Sadece tek iletişim linki varsa direkt yönlendir
                    window.location.href = otherLinks[0].url;
                    return;
                }
                
                if (profileLinks.length > 0) {
                    let linksHtml = "";
                    otherLinks.forEach(link => {
                        linksHtml += `
                            <a href="${link.url}" style="background: rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 20px; text-decoration: none; color: #fff; display: flex; align-items: center; gap: 16px; transition: all 0.3s ease; border: 1px solid rgba(255, 255, 255, 0.2);">
                                <span style="font-size: 32px;">${link.icon}</span>
                                <div style="flex: 1; text-align: left;">
                                    <div style="font-size: 18px; font-weight: 600; margin-bottom: 4px;">${link.label}</div>
                                    <div style="font-size: 14px; opacity: 0.8;">${link.value}</div>
                                </div>
                                <span style="font-size: 20px; opacity: 0.7;">→</span>
                            </a>
                        `;
                    });
                    ibanLinks.forEach(link => {
                        const ibanFormatted = (link.value || "").replace(/\s/g, " ");
                        const accountNameEscaped = (link.accountName || "").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                        const hasAccountName = link.accountName && link.accountName.trim() !== "";
                        linksHtml += `
                            <div class="iban-card" style="background: rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 20px; color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); text-align: left;">
                                <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 12px;">
                                    <span style="font-size: 32px;">${link.icon}</span>
                                    <div style="font-size: 18px; font-weight: 600;">${link.label}</div>
                                </div>
                                ${link.accountName ? `<div style="font-size: 14px; opacity: 0.95; margin-bottom: 6px;"><strong>Ad Soyad:</strong> ${link.accountName}</div>` : ""}
                                ${link.bankName ? `<div style="font-size: 14px; opacity: 0.95; margin-bottom: 6px;"><strong>Banka:</strong> ${link.bankName}</div>` : ""}
                                <div style="font-size: 14px; opacity: 0.95; margin-bottom: 12px;"><strong>IBAN:</strong> <span class="iban-value">${ibanFormatted}</span></div>
                                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                                    ${hasAccountName ? `<button type="button" class="copy-name-btn" data-account-name="${accountNameEscaped}" style="background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;">Ad Soyad Kopyala</button>` : ""}
                                    <button type="button" class="copy-iban-btn" data-iban="${ibanFormatted.replace(/"/g, '&quot;')}" style="background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;">IBAN\'ı Kopyala</button>
                                </div>
                            </div>
                        `;
                    });
                    contentDiv.innerHTML = `
                        <h1 style="font-size: 28px; margin-bottom: 16px; font-weight: 700;">${ibanLinks.length && otherLinks.length ? "İletişim ve Ödeme" : ibanLinks.length ? "Ödeme Bilgileri" : "İletişim Bilgileri"}</h1>
                        <p style="font-size: 16px; line-height: 1.6; margin-bottom: 32px; opacity: 0.9;">${ibanLinks.length && otherLinks.length ? "İletişime geçin veya ödeme bilgilerini kopyalayın" : ibanLinks.length ? "Havale / EFT için aşağıdaki bilgileri kullanabilirsiniz" : "İletişime geçmek için bir seçenek seçin"}</p>
                        <div style="display: flex; flex-direction: column; gap: 16px;">
                            ${linksHtml}
                        </div>
                    `;
                    // IBAN kopyalama butonları
                    contentDiv.querySelectorAll(".copy-iban-btn").forEach(btn => {
                        btn.addEventListener("click", function() {
                            const iban = (this.getAttribute("data-iban") || "").replace(/\s/g, "");
                            if (!iban) return;
                            navigator.clipboard.writeText(iban).then(function() {
                                const t = btn.textContent;
                                btn.textContent = "Kopyalandı!";
                                btn.style.background = "rgba(76, 175, 80, 0.6)";
                                setTimeout(function() { btn.textContent = t; btn.style.background = ""; }, 2000);
                            });
                        });
                    });
                    // Ad Soyad kopyalama butonları
                    contentDiv.querySelectorAll(".copy-name-btn").forEach(btn => {
                        btn.addEventListener("click", function() {
                            const name = this.getAttribute("data-account-name") || "";
                            const decoded = name.replace(/&quot;/g, '"').replace(/&lt;/g, "<").replace(/&gt;/g, ">");
                            if (!decoded) return;
                            navigator.clipboard.writeText(decoded).then(function() {
                                const t = btn.textContent;
                                btn.textContent = "Kopyalandı!";
                                btn.style.background = "rgba(76, 175, 80, 0.6)";
                                setTimeout(function() { btn.textContent = t; btn.style.background = ""; }, 2000);
                            });
                        });
                    });
                }
            } else {
                // Profil linki yoksa karakter sayfasına yönlendir
                const characterId = tagData.characterId;
                if (characterId) {
                    window.location.href = `https://dahis.io/character/${characterId}`;
                    return;
                }
                
                // Fallback
                contentDiv.innerHTML = `
                    <div class="error">
                        <h2>Bilinmeyen Durum</h2>
                        <p>Tag bilgisi yüklenemedi.</p>
                        <a href="/" style="color: #fff; text-decoration: underline; margin-top: 20px; display: inline-block;">Ana Sayfaya Dön</a>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
